services:
  frontend:
    platform: linux/arm64
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.frontend
    container_name: appointment-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mern

  backend:
    platform: linux/arm64
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: appointment-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    networks:
      - mern

  mongodb:
    image: mongo:latest
    container_name: appointment--mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_URI=mongodb://vernikag:VernikaG%404@mongo:27017/appointments?authSource=appointments&directConnection=true
    volumes:
      - mongo-data:/data/db

networks:
  mern:
    driver: bridge

volumes:
  mongo-data: {}
